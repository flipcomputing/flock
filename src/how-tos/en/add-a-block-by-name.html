<goal>Add a block straight into your code by typing its name.</goal>

<topic>
  <topic-title>Add a block by name</topic-title>
  <p>
    Select the block you want the new block to follow, then press
    <kbd>Ctrl</kbd>+<kbd>.</kbd> and type part of a block's name, like <code>print</code>. A list
    of matching blocks appears. Press <kbd>Enter</kbd> to add the top match straight after the
    selected block.
  </p>
</topic>
