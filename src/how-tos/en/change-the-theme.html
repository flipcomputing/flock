<goal>Change the colours of Flock XR to suit you.</goal>

<topic>
  <topic-title>Change the theme</topic-title>
  <p>
    Open the <ui-button target="mainmenu">Menu</ui-button>, choose
    <link-to target="thememenu">Theme</link-to> and pick a theme: <strong>Light</strong>,
    <strong>Dark</strong>, <strong>Contrast</strong> or <strong>Low color</strong>. With the
    keyboard, press <kbd>Ctrl</kbd>+<kbd>M</kbd> to go to the menu, then use the arrow keys and
    <kbd>Enter</kbd>.
  </p>
</topic>
