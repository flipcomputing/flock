<topic>
  <topic-title>Join pieces of text</topic-title>
  <p>
    The <strong>text</strong> block in
    <ui-button target="toolbox:STRINGS">Strings</ui-button> joins its pieces into one piece of text.
    Press <block-icon name="add-item"></block-icon> to add a piece, or
    <block-icon name="remove-item"></block-icon> to remove one.
  </p>
  <p>A piece can be a number or a variable, such as a count of clicks.</p>
  <snippet src="join-text"></snippet>
</topic>

<topic>
  <topic-title>Add to the end</topic-title>
  <p>
    <strong>append text</strong> adds more text to the end of a variable.
  </p>
</topic>
