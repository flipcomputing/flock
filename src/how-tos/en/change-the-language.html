<goal>Use Flock XR in your own language.</goal>

<topic>
  <topic-title>Change the language</topic-title>
  <p>
    Open the <ui-button target="mainmenu">Menu</ui-button>, choose
    <link-to target="languagemenu">Language</link-to> and pick your language. The menus and the
    blocks in your code change to that language. With the keyboard, press
    <kbd>Ctrl</kbd>+<kbd>M</kbd> to go to the menu, then use the arrow keys and <kbd>Enter</kbd>.
  </p>
</topic>
